<html lang="it">

  <title>Il Mestiere del Sindaco | Giancarlo Volpe</title>

  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;

      --text: #111827;
      --muted: #6b7280;
      --border: #d9e1ea;
      --accent: #1e40af;
      --accent-light: #dbeafe;
      --accent-glow: rgba(30, 64, 175, 0.15);

      --shadow: 0 18px 50px rgba(17, 24, 39, 0.08);
      --radius: 24px;
      --hero-overlay: rgba(245, 247, 250, 0.92);
      --hero-overlay-mid: rgba(245, 247, 250, 0.72);
      --hero-overlay-end: rgba(245, 247, 250, 0.18);
      --hero-text: #111827;
    }

    html[data-theme="dark"] {
      --bg: #0b1220;
      --surface: #111827;
      --surface-soft: #0f172a;

      --hero-overlay-mid: rgba(11, 18, 32, 0.72);
      --hero-overlay-end: rgba(11, 18, 32, 0.22);
      --hero-text: #e5e7eb;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    a { color: inherit; }
    .container { width: min(1160px, calc(100% - 32px)); margin: 0 auto; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px var(--accent-glow);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .menu { display: flex; align-items: center; }
    .menu a {
      margin-left: 18px;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
    }
    .menu a:hover { color: var(--text); }

    .theme-toggle,
    .hamburger {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .theme-toggle:hover,
    .hamburger:hover { transform: translateY(-1px); }

    .hamburger {
      display: none;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      font-size: 1.2rem;
    }

    .mobile-menu {
      display: none;
      position: fixed;
      inset: 74px 0 auto 0;
      z-index: 40;
      padding: 18px 16px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .mobile-menu.open { display: block; }

    .mobile-menu a {
      display: block;
      padding: 14px 10px;
      border-radius: 14px;
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }

    .mobile-menu a:hover { background: var(--surface-soft); }
